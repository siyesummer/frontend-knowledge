name: siye-production-knowledge

services:
  knowledge:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
    image: ${KNOWLEDGE_IMAGE:-siye-knowledge:local}
    container_name: siye-prod-knowledge
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MD_VIEWER_PORT: "3001"
      KNOWLEDGE_ROOT: /knowledge
    volumes:
      - ${KNOWLEDGE_REPO_DIR:?KNOWLEDGE_REPO_DIR is required}:/knowledge:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      edge-net:
        aliases:
          - knowledge

networks:
  edge-net:
    name: siye-prod-edge-net
    external: true

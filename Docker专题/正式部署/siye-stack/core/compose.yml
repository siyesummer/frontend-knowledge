name: siye-production-core

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  siye-world:
    image: ${SIYE_WORLD_IMAGE:?SIYE_WORLD_IMAGE is required}
    container_name: siye-prod-world
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - edge-net

  music-api:
    image: ${MUSIC_API_IMAGE:?MUSIC_API_IMAGE is required}
    container_name: siye-prod-music-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      TZ: ${TZ:?TZ is required}
      CORS_ALLOW_ORIGIN: ${MUSIC_API_CORS_ALLOW_ORIGIN:?MUSIC_API_CORS_ALLOW_ORIGIN is required}
      LOG_FILE: ${MUSIC_API_LOG_FILE:?MUSIC_API_LOG_FILE is required}
      ERROR_LOG_FILE: ${MUSIC_API_ERROR_LOG_FILE:?MUSIC_API_ERROR_LOG_FILE is required}
    group_add:
      - ${SIYE_LOG_GID:?SIYE_LOG_GID is required}
    volumes:
      - ${SIYE_DOCKER_LOG_DIR:?SIYE_DOCKER_LOG_DIR is required}:/var/log/siye
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - edge-net

  mysql:
    image: ${MYSQL_IMAGE:?MYSQL_IMAGE is required}
    container_name: siye-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: ${TZ:?TZ is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks:
      - chat-data-net

  linux-server:
    image: ${LINUX_SERVER_IMAGE:?LINUX_SERVER_IMAGE is required}
    container_name: siye-prod-linux-server
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      APP_CORS_ALLOWED_ORIGINS: ${LINUX_SERVER_CORS_ALLOW_ORIGINS:?LINUX_SERVER_CORS_ALLOW_ORIGINS is required}
      TZ: ${TZ:?TZ is required}
    group_add:
      - ${SIYE_LOG_GID:?SIYE_LOG_GID is required}
    volumes:
      - ${SIYE_DOCKER_LOG_DIR:?SIYE_DOCKER_LOG_DIR is required}:/var/log/siye:ro
    logging: *default-logging
    networks:
      - edge-net
      - chat-data-net

  easy-chat:
    image: ${EASY_CHAT_IMAGE:?EASY_CHAT_IMAGE is required}
    container_name: siye-prod-easy-chat
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3030"
      CORS_ALLOW_ORIGIN: ${EASY_CHAT_CORS_ALLOW_ORIGIN:?EASY_CHAT_CORS_ALLOW_ORIGIN is required}
      TZ: ${TZ:?TZ is required}
      LOG_FILE: ${EASY_CHAT_LOG_FILE:?EASY_CHAT_LOG_FILE is required}
      ERROR_LOG_FILE: ${EASY_CHAT_ERROR_LOG_FILE:?EASY_CHAT_ERROR_LOG_FILE is required}
    group_add:
      - ${SIYE_LOG_GID:?SIYE_LOG_GID is required}
    volumes:
      - ${SIYE_DOCKER_LOG_DIR:?SIYE_DOCKER_LOG_DIR is required}:/var/log/siye
    logging: *default-logging
    networks:
      - edge-net

volumes:
  mysql-data:
    name: siye-prod-mysql-data

networks:
  edge-net:
    name: siye-prod-edge-net
    external: true
  chat-data-net:
    name: siye-prod-chat-data-net
    driver: bridge
    internal: true

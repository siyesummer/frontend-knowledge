map $http_upgrade $siye_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name
        siyes.cn
        www.siyes.cn
        music.siyes.cn
        music-api.siyes.cn
        linux-api.siyes.cn
        socket.siyes.cn
        sub2api.siyes.cn
        draw.siyes.cn
        knowledge.siyes.cn;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name
        siyes.cn
        www.siyes.cn
        music.siyes.cn
        music-api.siyes.cn
        linux-api.siyes.cn
        socket.siyes.cn
        sub2api.siyes.cn
        draw.siyes.cn;

    ssl_certificate /etc/letsencrypt/live/siyes-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siyes-production/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SIYE_HOST_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/siyes-docker-edge.access.log;
    error_log /var/log/nginx/siyes-docker-edge.error.log;

    client_max_body_size 100m;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Reset client-supplied X-Forwarded-For at the public trust boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $siye_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name knowledge.siyes.cn;

    ssl_certificate /etc/letsencrypt/live/siyes-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siyes-production/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SIYE_HOST_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/knowledge.siyes.cn.access.log;
    error_log /var/log/nginx/knowledge.siyes.cn.error.log;

    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Retry-After 3600 always;
    return 503 '{"code":503,"service":"frontend-knowledge","status":"pending"}';
}

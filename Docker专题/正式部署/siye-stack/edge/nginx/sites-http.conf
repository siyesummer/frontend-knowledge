server {
    listen 80 default_server;
    server_name _;

    location = /edge-health {
        access_log off;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"code":0,"service":"siye-prod-edge-nginx","status":"ok"}';
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name siyes.cn www.siyes.cn;

    root /var/www/siyes.cn;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name music.siyes.cn;

    location / {
        proxy_pass http://siye_world_upstream;
        include /etc/nginx/siye/proxy-common.conf;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name music-api.siyes.cn;

    location / {
        proxy_pass http://music_api_upstream;
        include /etc/nginx/siye/proxy-common.conf;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name linux-api.siyes.cn;

    location / {
        proxy_pass http://linux_server_upstream;
        include /etc/nginx/siye/proxy-common.conf;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name socket.siyes.cn;

    location / {
        proxy_pass http://easy_chat_upstream;
        include /etc/nginx/siye/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}

server {
    listen 80;
    server_name sub2api.siyes.cn;

    location / {
        proxy_pass http://sub2api_upstream;
        include /etc/nginx/siye/proxy-common.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name draw.siyes.cn;

    location / {
        proxy_pass http://svg_draw_upstream;
        include /etc/nginx/siye/proxy-common.conf;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name knowledge.siyes.cn;

    location / {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"code":503,"service":"frontend-knowledge","status":"pending"}';
    }
}

name: siye-production-edge

services:
  edge-nginx:
    image: ${EDGE_NGINX_IMAGE:?EDGE_NGINX_IMAGE is required}
    container_name: siye-prod-edge-nginx
    restart: unless-stopped
    ports:
      - ${EDGE_HTTP_BIND_ADDRESS:?EDGE_HTTP_BIND_ADDRESS is required}:${EDGE_HTTP_HOST_PORT:?EDGE_HTTP_HOST_PORT is required}:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstreams.conf:/etc/nginx/siye/upstreams.conf:ro
      - ./nginx/proxy-common.conf:/etc/nginx/siye/proxy-common.conf:ro
      - ${EDGE_NGINX_SITES_FILE:?EDGE_NGINX_SITES_FILE is required}:/etc/nginx/siye/sites.conf:ro
      - ${SIYES_HOME_DIR:?SIYES_HOME_DIR is required}:/var/www/siyes.cn:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/edge-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - edge-net

networks:
  edge-net:
    name: siye-prod-edge-net
    external: true


services:
  mysql:
    image: mysql:8.0.39
    container_name: lab2-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net

  linux-server:
    build:
      context: ./linux-server
      dockerfile: Dockerfile
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:21-jre}
    container_name: lab2-linux-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker-lab
    ports:
      - "${LINUX_SERVER_HOST_PORT:-8084}:8081"
    volumes:
      - /var/log/siye:/var/log/siye:ro
    networks:
      - app-net

  easy-chat:
    build:
      context: ./easy-chat
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
    container_name: lab2-easy-chat
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LISTENING_PORT: 3030
      SERVER_HOST: ${SERVER_HOST:-YOUR_SERVER_IP}
    ports:
      - "${EASY_CHAT_HOST_PORT:-3031}:3030"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-net

volumes:
  mysql_data:

networks:
  app-net:
    driver: bridge

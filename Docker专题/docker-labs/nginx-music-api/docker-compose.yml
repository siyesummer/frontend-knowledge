services:
  nginx:
    image: ${NGINX_APP_IMAGE:-siye-nginx-music-api:1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    container_name: lab4-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MUSIC_API_UPSTREAM: ${MUSIC_API_UPSTREAM:-host.docker.internal:3002}
      NGINX_ENVSUBST_FILTER: ^MUSIC_API_UPSTREAM$
    ports:
      - "${NGINX_HOST_PORT:-8085}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

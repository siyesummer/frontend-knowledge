services:
  music-api:
    build:
      context: ./NeteaseCloudMusicApi-4.13.8
      dockerfile: ../Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
    container_name: lab3-music-api
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MUSIC_API_HOST_PORT:-3002}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const socket=require('net').connect(3000,'127.0.0.1');socket.on('connect',()=>{socket.destroy();process.exit(0)});socket.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

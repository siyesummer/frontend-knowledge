name: siye-release-drill

services:
  mysql:
    image: ${MYSQL_IMAGE:?MYSQL_IMAGE is required}
    container_name: drill7-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data-net

  music-api:
    image: ${MUSIC_API_IMAGE:?MUSIC_API_IMAGE is required}
    container_name: drill7-music-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TZ: Asia/Shanghai
      CORS_ALLOW_ORIGIN: ${MUSIC_API_CORS_ALLOW_ORIGIN:?MUSIC_API_CORS_ALLOW_ORIGIN is required}
    ports:
      - "${MUSIC_API_BIND_ADDRESS:-0.0.0.0}:${MUSIC_API_HOST_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-net

  linux-server:
    image: ${LINUX_SERVER_IMAGE:?LINUX_SERVER_IMAGE is required}
    container_name: drill7-linux-server
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      APP_CORS_ALLOWED_ORIGINS: ${LINUX_SERVER_CORS_ALLOW_ORIGINS:?LINUX_SERVER_CORS_ALLOW_ORIGINS is required}
      TZ: Asia/Shanghai
    group_add:
      - "${SIYE_LOG_GID:?SIYE_LOG_GID is required}"
    ports:
      - "${LINUX_SERVER_BIND_ADDRESS:-0.0.0.0}:${LINUX_SERVER_HOST_PORT:-8181}:8081"
    volumes:
      - ${SIYE_LOG_DIR:?SIYE_LOG_DIR is required}:/var/log/siye:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-net
      - data-net

  easy-chat:
    image: ${EASY_CHAT_IMAGE:?EASY_CHAT_IMAGE is required}
    container_name: drill7-easy-chat
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3030
      SERVER_HOST: 0.0.0.0
      CORS_ALLOW_ORIGIN: ${EASY_CHAT_CORS_ALLOW_ORIGIN:?EASY_CHAT_CORS_ALLOW_ORIGIN is required}
      TZ: Asia/Shanghai
    ports:
      - "${EASY_CHAT_BIND_ADDRESS:-0.0.0.0}:${EASY_CHAT_HOST_PORT:-3130}:3030"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-net

  siye-world:
    image: ${SIYE_WORLD_IMAGE:?SIYE_WORLD_IMAGE is required}
    container_name: drill7-siye-world
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-net

  edge-nginx:
    image: ${EDGE_NGINX_IMAGE:?EDGE_NGINX_IMAGE is required}
    container_name: drill7-edge-nginx
    restart: unless-stopped
    depends_on:
      music-api:
        condition: service_healthy
      linux-server:
        condition: service_healthy
      easy-chat:
        condition: service_healthy
      siye-world:
        condition: service_healthy
    ports:
      - "${EDGE_NGINX_BIND_ADDRESS:-0.0.0.0}:${EDGE_NGINX_HOST_PORT:-8090}:80"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-net

volumes:
  mysql_data:

networks:
  edge-net:
    name: siye-release-drill-edge-net
    driver: bridge
  data-net:
    name: siye-release-drill-data-net
    driver: bridge
    internal: true
